<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Image Gallery</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==================== CSS STYLES ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        /* Screens Management */
        .app-screen {
            display: none;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            position: relative;
        }
        .app-screen.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            background: #1a1a1a;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 800;
        }
        .btn-upload-nav {
            background: #25d366;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
        }
        .btn-upload-nav:active { transform: scale(0.95); }

        /* Back Button */
        .btn-back {
            background: transparent;
            color: white;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* Home Feed */
        .feed-container {
            padding: 20px;
            background: #f4f6f9;
            min-height: calc(100vh - 60px);
        }
        
        .profile-card {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        
        .profile-name-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #b91338;
            margin-bottom: 10px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        /* Image Slider (Left to Right) */
        .image-stack {
            display: flex;
            flex-direction: row;
            gap: 15px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 10px;
        }

        /* Hide Scrollbar but keep functionality */
        .image-stack::-webkit-scrollbar {
            height: 8px;
        }
        .image-stack::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .image-stack::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }

        .image-box {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 10px;
            flex: 0 0 100%; /* Takes full width of the container for snap */
            scroll-snap-align: center;
        }

        .image-box img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            object-fit: cover;
        }

        .btn-whatsapp {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-whatsapp:active { transform: scale(0.98); }

        /* Manage Page */
        .manage-container {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        .form-control:focus {
            border-color: #b91338;
        }

        .btn-submit {
            width: 100%;
            background: #b91338;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:active { transform: scale(0.95); }

        /* Management List */
        .management-list {
            margin-top: 30px;
        }
        .manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .manage-item-info strong {
            font-size: 1.1rem;
            color: #333;
            display: block;
        }
        .manage-item-info span {
            font-size: 0.8rem;
            color: #888;
        }
        .manage-actions {
            display: flex;
            gap: 10px;
        }
        .btn-view {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }
        .btn-edit {
            background: #f1c40f;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }
        .btn-delete {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        /* Modals (Admin Auth & Admin View) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Loader Overlay */
        #loaderOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10000;
        }
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #b91338;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- ==================== SCREEN 1: HOME (FEED) ==================== -->
    <div id="screen-home" class="app-screen active">
        <div class="header">
            <h1>Profiles Gallery</h1>
            <!-- Open Admin Auth Modal instead of directly going to Manage -->
            <button class="btn-upload-nav" onclick="openAdminAuth()">
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload
            </button>
        </div>
        <div class="feed-container" id="feedContainer">
            <!-- Profiles will load here dynamically -->
        </div>
    </div>

    <!-- ==================== SCREEN 2: UPLOAD & MANAGE ==================== -->
    <div id="screen-manage" class="app-screen">
        <div class="header">
            <button class="btn-back" onclick="switchScreen('screen-home')"><i class="fa-solid fa-arrow-left"></i></button>
            <h1>Manage Profiles</h1>
            <div style="width: 20px;"></div> <!-- Spacer -->
        </div>
        
        <div class="manage-container">
            <h2 style="margin-bottom: 15px; font-size: 1.2rem; color: #1a1a1a;" id="formTitle">Add New Profile</h2>
            
            <form id="uploadForm">
                <input type="hidden" id="editProfileId" value="">
                
                <div class="form-group">
                    <label>Profile Name</label>
                    <input type="text" id="profileName" class="form-control" placeholder="Enter Name (e.g. Rahul Kumar)" required>
                </div>

                <div class="form-group">
                    <label>Profile Password (Secret Code)</label>
                    <input type="text" id="profilePassword" class="form-control" placeholder="Enter password for future ON/OFF control" required>
                </div>

                <!-- OPTIONAL FIELDS FOR ADMIN ONLY -->
                <div class="form-group">
                    <label>Mobile Number (Optional)</label>
                    <input type="text" id="profileMobile" class="form-control" placeholder="Enter Mobile No.">
                </div>
                
                <div class="form-group">
                    <label>Address (Optional)</label>
                    <input type="text" id="profileAddress" class="form-control" placeholder="Enter Address">
                </div>

                <div class="form-group">
                    <label>Age (Optional)</label>
                    <input type="number" id="profileAge" class="form-control" placeholder="Enter Age">
                </div>
                
                <div class="form-group">
                    <label>Upload Images (Select Multiple)</label>
                    <input type="file" id="profileImages" class="form-control" accept="image/*" multiple>
                    <small style="color: #888; display: block; margin-top: 5px;">*You can select multiple images at once.</small>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Save & Upload</button>
                <button type="button" class="btn-submit" id="cancelEditBtn" style="background:#888; margin-top:10px; display:none;" onclick="resetForm()">Cancel Edit</button>
            </form>

            <div class="management-list">
                <h3 style="margin-bottom: 15px; font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 10px;">Existing Profiles</h3>
                <div id="manageListContainer">
                    <!-- Management list items will load here dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== ADMIN AUTH MODAL ==================== -->
    <div id="adminAuthModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px; color:#1a1a1a;">Admin Access Required</h3>
            <p style="font-size: 0.9rem; color:#666; margin-bottom: 15px;">Please enter the secret code to upload or manage profiles.</p>
            <input type="password" id="adminCodeInput" class="form-control" placeholder="Enter Secret Code">
            <button onclick="verifyAdminCode()" class="btn-submit" style="margin-top:15px;">Login</button>
            <button onclick="closeAdminAuth()" class="btn-submit" style="background:#888; margin-top:10px;">Cancel</button>
        </div>
    </div>

    <!-- ==================== ADMIN PROFILE VIEW MODAL ==================== -->
    <div id="adminViewModal" class="modal-overlay">
        <div class="modal-content" style="text-align: left;">
            <h3 id="viewName" style="color: #b91338; margin-bottom: 15px; font-size: 1.4rem; border-bottom: 2px solid #eee; padding-bottom: 10px;"></h3>
            <p style="margin-bottom: 8px;"><strong><i class="fa-solid fa-phone"></i> Mobile:</strong> <span id="viewMobile" style="color:#555;"></span></p>
            <p style="margin-bottom: 8px;"><strong><i class="fa-solid fa-location-dot"></i> Address:</strong> <span id="viewAddress" style="color:#555;"></span></p>
            <p style="margin-bottom: 8px;"><strong><i class="fa-solid fa-calendar-days"></i> Age:</strong> <span id="viewAge" style="color:#555;"></span></p>
            <p style="margin-bottom: 8px;"><strong><i class="fa-solid fa-key"></i> Secret Code:</strong> <span id="viewPassword" style="color:#555;"></span></p>
            <p style="margin-bottom: 8px;"><strong><i class="fa-solid fa-image"></i> Total Images:</strong> <span id="viewImgCount" style="color:#555;"></span></p>
            <button onclick="closeViewModal()" class="btn-submit" style="margin-top:20px;">Close View</button>
        </div>
    </div>

    <!-- ==================== LOADER ==================== -->
    <div id="loaderOverlay">
        <div class="spinner"></div>
        <h3 id="loaderText">Uploading... Please wait</h3>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 1. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB0asuJKj9wyoInuS6_mhLdWDo4OkAM_k4",
            authDomain: "oooo-67c5c.firebaseapp.com",
            databaseURL: "https://oooo-67c5c-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "oooo-67c5c",
            storageBucket: "oooo-67c5c.firebasestorage.app",
            messagingSenderId: "605074662310",
            appId: "1:605074662310:web:aeb1610acf19a39413e567",
            measurementId: "G-N7SZ6YW3L5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ImgBB API KEY
        const IMGBB_API_KEY = "4b37104c00c3bed32399d9f458226c88"; 
        
        let allProfiles = [];

        // UI Functions (Screen Management)
        window.switchScreen = function(screenId) {
            document.querySelectorAll('.app-screen').forEach(scr => scr.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0, 0);
        };

        window.showLoader = function(text = "Uploading... Please wait") {
            document.getElementById('loaderText').innerText = text;
            document.getElementById('loaderOverlay').style.display = 'flex';
        };

        window.hideLoader = function() {
            document.getElementById('loaderOverlay').style.display = 'none';
        };

        // ================== ADMIN SECRECY (Himanshu@123) ==================
        window.openAdminAuth = function() {
            document.getElementById('adminCodeInput').value = '';
            document.getElementById('adminAuthModal').style.display = 'flex';
        };

        window.closeAdminAuth = function() {
            document.getElementById('adminAuthModal').style.display = 'none';
        };

        window.verifyAdminCode = function() {
            const code = document.getElementById('adminCodeInput').value;
            if(code === 'Himanshu@123') {
                closeAdminAuth();
                window.switchScreen('screen-manage');
            } else {
                alert("Incorrect Secret Code! Access Denied.");
            }
        };

        // ================== ADMIN PROFILE VIEW MODAL ==================
        window.viewAdminProfile = function(id) {
            const profile = allProfiles.find(p => p.id === id);
            if(!profile) return;

            document.getElementById('viewName').innerText = profile.name || 'N/A';
            document.getElementById('viewMobile').innerText = profile.mobile || 'N/A';
            document.getElementById('viewAddress').innerText = profile.address || 'N/A';
            document.getElementById('viewAge').innerText = profile.age || 'N/A';
            document.getElementById('viewPassword').innerText = profile.password || 'N/A';
            document.getElementById('viewImgCount').innerText = profile.images ? profile.images.length : 0;
            
            document.getElementById('adminViewModal').style.display = 'flex';
        };

        window.closeViewModal = function() {
            document.getElementById('adminViewModal').style.display = 'none';
        };

        // ================== CANVAS CORS BYPASS FUNCTION ==================
        window.getBlobFromCanvas = function(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0);
                    canvas.toBlob((blob) => {
                        if(blob) resolve(blob);
                        else reject(new Error("Canvas toBlob failed"));
                    }, "image/jpeg", 0.95);
                };
                img.onerror = () => reject(new Error("Canvas image load failed"));
                img.src = url;
            });
        };

        // ================== DIRECT FILE SHARE ON WHATSAPP (MULTI-FALLBACK) ==================
        window.shareImageFile = async function(imgUrl) {
            try {
                window.showLoader("Preparing image for WhatsApp...");
                
                let blob = null;
                
                // Method 1: Direct Fetch (Fastest)
                try {
                    const res = await fetch(imgUrl);
                    if(res.ok) blob = await res.blob();
                } catch(e) { console.log("Method 1 failed"); }

                // Method 2: Canvas CORS Bypass (Very reliable)
                if (!blob) {
                    try {
                        blob = await window.getBlobFromCanvas(imgUrl);
                    } catch(e) { console.log("Method 2 failed"); }
                }

                // Method 3: Proxy 1 (corsproxy.io)
                if (!blob) {
                    try {
                        const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(imgUrl));
                        if(res.ok) blob = await res.blob();
                    } catch(e) { console.log("Method 3 failed"); }
                }

                // Method 4: Proxy 2 (allorigins)
                if (!blob) {
                    const res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(imgUrl));
                    if(res.ok) blob = await res.blob();
                }

                // Agar sab fail ho gaya tabhi error dikhega
                if (!blob) throw new Error("Network/Firewall is blocking the image download.");

                // Determine extension
                let ext = 'jpg';
                if(blob.type && blob.type.includes('png')) ext = 'png';
                else if(blob.type && blob.type.includes('gif')) ext = 'gif';
                else if(blob.type && blob.type.includes('webp')) ext = 'webp';
                
                const file = new File([blob], `gallery_image_${Date.now()}.${ext}`, { type: blob.type || 'image/jpeg' });

                // Share ONLY the file (No text, No Link)
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    window.hideLoader();
                    await navigator.share({
                        files: [file] 
                    });
                } else {
                    window.hideLoader();
                    alert("Your browser/device does not support direct file sharing. Please download it manually.");
                }
            } catch (error) {
                window.hideLoader();
                console.error("Direct image share failed.", error);
                alert("Share Failed: " + error.message + "\n\nTry turning off your VPN/AdBlocker or switch internet connection.");
            }
        };

        // Fetch Profiles Realtime from Firebase
        onValue(ref(db, 'user_galleries'), (snapshot) => {
            const data = snapshot.val();
            allProfiles = [];
            if (data) {
                Object.entries(data).forEach(([id, val]) => {
                    allProfiles.push({ id, ...val });
                });
            }
            renderHomeFeed();
            renderManageList();
        }, (error) => {
            alert("Firebase Read Error! आपके Firebase Rules locked हैं। कृपया Firebase Console में जाकर Database rules को true करें। Error: " + error.message);
        });

        // Render Home Feed
        function renderHomeFeed() {
            const container = document.getElementById('feedContainer');
            container.innerHTML = '';

            if (allProfiles.length === 0) {
                container.innerHTML = `<h3 style="text-align:center; color:#888; margin-top:50px;">No profiles found.</h3>`;
                return;
            }

            // Reverse to show latest first
            const reversedProfiles = [...allProfiles].reverse();
            let visibleCount = 0;

            reversedProfiles.forEach(profile => {
                // VISIBILITY LOGIC
                if (profile.isVisible === false) {
                    return; 
                }
                
                visibleCount++;
                const card = document.createElement('div');
                card.className = 'profile-card';
                
                let imagesHTML = '';
                if (profile.images && profile.images.length > 0) {
                    profile.images.forEach(imgUrl => {
                        imagesHTML += `
                            <div class="image-box">
                                <img src="${imgUrl}" alt="${profile.name}">
                                <!-- SHARE BUTTON: Only passes the URL to download the raw file -->
                                <button class="btn-whatsapp" style="width: 100%; border: none; cursor: pointer;" onclick="shareImageFile('${imgUrl}')">
                                    <i class="fa-brands fa-whatsapp" style="font-size: 1.2rem;"></i> Share Image
                                </button>
                            </div>
                        `;
                    });
                } else {
                    imagesHTML = `<p style="color:#888; font-size:0.9rem;">No images uploaded yet.</p>`;
                }

                // Show instruction if multiple images exist
                let swipeHint = profile.images && profile.images.length > 1 
                                ? `<p style="font-size:0.75rem; color:#888; margin-bottom:10px;"><i class="fa-solid fa-arrows-left-right"></i> Swipe left/right to view more images</p>` 
                                : '';

                card.innerHTML = `
                    <div class="profile-name-title"><i class="fa-solid fa-user-circle"></i> ${profile.name}</div>
                    ${swipeHint}
                    <div class="image-stack">
                        ${imagesHTML}
                    </div>
                `;
                container.appendChild(card);
            });

            if(visibleCount === 0) {
                container.innerHTML = `<h3 style="text-align:center; color:#888; margin-top:50px;">No visible profiles right now.</h3>`;
            }
        }

        // Render Management List (View/Edit/Delete)
        function renderManageList() {
            const container = document.getElementById('manageListContainer');
            container.innerHTML = '';

            if (allProfiles.length === 0) {
                container.innerHTML = `<p style="color:#888; font-size:0.9rem;">No profiles available.</p>`;
                return;
            }

            allProfiles.forEach(profile => {
                const picCount = profile.images ? profile.images.length : 0;
                const item = document.createElement('div');
                item.className = 'manage-item';
                
                item.innerHTML = `
                    <div class="manage-item-info">
                        <strong>${profile.name} ${profile.isVisible === false ? '<span style="color:red;">(Hidden)</span>' : ''}</strong>
                        <span>${picCount} image(s) | Password: ${profile.password || 'N/A'}</span>
                    </div>
                    <div class="manage-actions">
                        <button class="btn-view" onclick="viewAdminProfile('${profile.id}')" title="View Details"><i class="fa-solid fa-eye"></i></button>
                        <button class="btn-edit" onclick="triggerEdit('${profile.id}')" title="Edit Profile"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-delete" onclick="triggerDelete('${profile.id}')" title="Delete Profile"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // ImgBB Upload Function With ERROR ALERTS
        async function uploadSingleImageToImgBB(file) {
            const formData = new FormData();
            formData.append('image', file);
            
            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if(data.success) {
                    return data.data.url;
                } else {
                    alert(`ImgBB Error: ${data.error ? data.error.message : 'Unknown Upload Error'}\n\nकृपया अपनी नई ImgBB API Key डालें!`);
                    return null;
                }
            } catch (error) {
                alert(`Network / API Error: ${error.message}\nकृपया अपना इंटरनेट चेक करें या AdBlocker बंद करें।`);
                console.error(error);
                return null;
            }
        }

        // Form Submit Logic (Add / Edit Profile with Multiple Images & Extra Fields)
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('profileName').value.trim();
            const password = document.getElementById('profilePassword').value.trim();
            
            // Getting Optional Fields
            const mobile = document.getElementById('profileMobile').value.trim();
            const address = document.getElementById('profileAddress').value.trim();
            const age = document.getElementById('profileAge').value.trim();
            
            const fileInput = document.getElementById('profileImages');
            const editId = document.getElementById('editProfileId').value;
            
            if(!name || !password) {
                alert("Please enter a name and password.");
                return;
            }

            const files = fileInput.files;
            let newlyUploadedUrls = [];

            if (files.length > 0) {
                window.showLoader(`Uploading ${files.length} image(s)...`);
                for(let i=0; i<files.length; i++) {
                    const uploadedUrl = await uploadSingleImageToImgBB(files[i]);
                    if(uploadedUrl) {
                        newlyUploadedUrls.push(uploadedUrl);
                    } else {
                        // If any upload fails, stop everything so user can fix it
                        window.hideLoader();
                        return; 
                    }
                }
            }

            if (editId) {
                // UPDATE EXISTING PROFILE
                window.showLoader("Updating Database...");
                
                const existingProfile = allProfiles.find(p => p.id === editId);
                let currentImages = existingProfile.images || [];
                const updatedImages = [...currentImages, ...newlyUploadedUrls];

                const updates = {};
                updates['/user_galleries/' + editId + '/name'] = name;
                updates['/user_galleries/' + editId + '/password'] = password;
                updates['/user_galleries/' + editId + '/mobile'] = mobile;
                updates['/user_galleries/' + editId + '/address'] = address;
                updates['/user_galleries/' + editId + '/age'] = age;
                updates['/user_galleries/' + editId + '/images'] = updatedImages;

                update(ref(db), updates).then(() => {
                    window.hideLoader();
                    alert("Profile updated successfully!");
                    window.resetForm();
                }).catch(err => {
                    window.hideLoader();
                    alert("Firebase Database Error (Upload Failed): " + err.message + "\n\nकृपया Firebase Database के Rules को 'true' करें!");
                });

            } else {
                // CREATE NEW PROFILE
                if(files.length === 0) {
                    alert("Please select at least one image to create a new profile.");
                    return;
                }

                window.showLoader("Saving to Database...");
                const newRef = push(ref(db, 'user_galleries'));
                
                set(newRef, {
                    name: name,
                    password: password,
                    mobile: mobile,
                    address: address,
                    age: age,
                    isVisible: true,
                    images: newlyUploadedUrls,
                    timestamp: new Date().toISOString()
                }).then(() => {
                    window.hideLoader();
                    alert("Profile created successfully!");
                    window.resetForm();
                    window.switchScreen('screen-home');
                }).catch(err => {
                    window.hideLoader();
                    alert("Firebase Database Error (Upload Failed): " + err.message + "\n\nकृपया Firebase Database के Rules को 'true' करें!");
                });
            }
        });

        // Edit Trigger - Adjusted to securely find profile by ID
        window.triggerEdit = function(id) {
            const profile = allProfiles.find(p => p.id === id);
            if(!profile) return;

            document.getElementById('formTitle').innerText = "Edit Profile (Add More Images)";
            document.getElementById('profileName').value = profile.name || '';
            document.getElementById('profilePassword').value = profile.password || '';
            
            // Pre-fill Optional Admin fields
            document.getElementById('profileMobile').value = profile.mobile || '';
            document.getElementById('profileAddress').value = profile.address || '';
            document.getElementById('profileAge').value = profile.age || '';

            document.getElementById('editProfileId').value = profile.id;
            
            document.getElementById('submitBtn').innerText = "Update Profile";
            document.getElementById('cancelEditBtn').style.display = "block";
            
            // Scroll to top to see the form
            window.scrollTo(0, 0);
        };

        // Reset Form 
        window.resetForm = function() {
            document.getElementById('uploadForm').reset();
            
            // Additional manual clears
            document.getElementById('profileMobile').value = "";
            document.getElementById('profileAddress').value = "";
            document.getElementById('profileAge').value = "";
            
            document.getElementById('editProfileId').value = "";
            document.getElementById('formTitle').innerText = "Add New Profile";
            document.getElementById('submitBtn').innerText = "Save & Upload";
            document.getElementById('cancelEditBtn').style.display = "none";
        };

        // Delete Trigger
        window.triggerDelete = function(id) {
            if(confirm("Are you sure you want to completely delete this profile?")) {
                window.showLoader("Deleting...");
                remove(ref(db, 'user_galleries/' + id)).then(() => {
                    window.hideLoader();
                }).catch(err => {
                    window.hideLoader();
                    alert("Error deleting (Firebase Rules issue): " + err.message);
                });
            }
        };

    </script>
</body>
</html>
