      align-items: center;
      overflow-x: hidden;

    @media (min-width: 500px) {

        height: 92vh;
        border-radius: 38px;
        border: 6px solid #161F38;
      }

    /* Glassmorphism & 3D Cards */

      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

    .glass-card-hover:active {
      transform: scale(0.975);
    }

    .btn-3d {
      position: relative;
      background: linear-gradient(135deg, #0088FF 0%, #0055FF 100%);
      box-shadow: 0 8px 24px rgba(0, 136, 255, 0.45), inset 0 1px 1px rgba(255,255,255,0.35);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-3d:active { transform: translateY(2px) scale(0.97); box-shadow: 0 4px 12px rgba(0,136,255,0.3); }

    .btn-neon {
      background: linear-gradient(135deg, #00FF87 0%, #00C96B 100%);
      color: #03120A;
      box-shadow: 0 8px 22px rgba(0, 255, 135, 0.35), inset 0 1px 1px rgba(255,255,255,0.5);
    }

    /* Animations */
    @keyframes float3D {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(4deg); }
    }
    @keyframes spinBall {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.06); }
      100% { transform: rotate(360deg) scale(1); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; box-shadow: 0 0 10px #FF2E54, 0 0 20px rgba(255, 46, 84, 0.5); }
      50% { opacity: 0.6; box-shadow: 0 0 4px #FF2E54; }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes progressLoad {
      0% { width: 0%; }
      60% { width: 78%; }
      100% { width: 100%; }
    }

    .screen-enter { animation: slideUp 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.04) 75%);

function showToast(title, subtitle = '', type = 'info') {
  const container = document.getElementById('toast-container');
  const colors = {
    success: 'border-neon/50 bg-emerald-950/90 text-neon',
    info: 'border-electric/50 bg-navy-900/95 text-cyanGlow',
    warn: 'border-gold/50 bg-amber-950/90 text-gold'
  };
  const toast = document.createElement('div');
  toast.className = `glass-card ${colors[type] || colors.info} rounded-2xl px-4 py-3 shadow-2xl border flex items-center justify-between gap-3 screen-enter pointer-events-auto`;
  toast.innerHTML = `
    <div>
      <div class="text-xs font-bold tracking-wide">${title}</div>
      ${subtitle ? `<div class="text-[11px] text-slate-300 mt-0.5">${subtitle}</div>` : ''}
    </div>
    <span class="text-xs opacity-70">✓</span>
  `;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 2600);
}

function openModal(html) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  content.innerHTML = html;
  overlay.classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});

// 3. NAVIGATION ENGINE (ALL 14 SCREENS)

function navigate(screen, params = {}, addToHistory = true) {
  if (addToHistory && state.currentScreen !== screen && state.currentScreen !== 'splash') {
    state.history.push({ screen: state.currentScreen, params: state.screenParams });
  }
  state.currentScreen = screen;
  state.screenParams = params;
  renderApp();
}

function goBack() {
  if (state.history.length > 0) {
    const prev = state.history.pop();
    state.currentScreen = prev.screen;
    state.screenParams = prev.params;
    renderApp();
  } else {
    navigate('home', {}, false);
  }
}

function renderBottomNav() {
  const nav = document.getElementById('bottom-nav');
  const fab = document.getElementById('fab-live');
  const hiddenNavScreens = ['splash', 'onboarding', 'login'];

  if (hiddenNavScreens.includes(state.currentScreen)) {
    nav.classList.add('hidden');
    fab.classList.add('hidden');
    return;

  nav.classList.remove('hidden');
  if (['home', 'sports', 'match-details'].includes(state.currentScreen)) {
    fab.classList.remove('hidden');

function simulateLiveEvent(matchId) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  if (m.sport === 'Cricket') {
    m.commentary.unshift({ time: '17.5', tag: 'FOUR!', color: 'text-gold', text: 'SIMULATED: Driven gloriously down the ground for 4 runs!' });
    m.teamA.score = '188/4';
    m.timer = '17.5 Ov';
  } else {
    m.commentary.unshift({ time: "78'", tag: 'CHANCE!', color: 'text-electric', text: 'SIMULATED: Close-range header hits the crossbar!' });
    m.timer = "78'";
  }
  showToast('Live Feed Updated!', `${m.teamA.short} vs ${m.teamB.short}`, 'info');
  renderApp();
}

function openPredictionForMatch(matchId) {
  state.predictionSlip.matchId = matchId;
  state.predictionSlip.selection = null;
  navigate('predictions');
}

function submitVirtualPrediction(matchId) {
  const slip = state.predictionSlip;
  if (!slip.selection) {
    showToast('Select an option first', 'Tap any prediction option above', 'warn');
    return;
  }
  if (state.user.virtualPoints < slip.stake) {
    showToast('Insufficient Virtual Points', 'Claim daily rewards to earn more VP!', 'warn');
    return;
  }
  const m = state.matches.find(x => x.id === matchId);
  state.user.virtualPoints -= slip.stake;
  const potential = Math.round(slip.stake * slip.multiplier);

  state.myPredictions.unshift({
    id: 'p' + Date.now(),
    match: `${m.teamA.name} vs ${m.teamB.name}`,
    sport: m.sport,
    market: slip.market,
    pick: slip.selection,
    stake: slip.stake,
    potential,
    status: 'Active',
    date: 'Just Now'
  });

  state.challenges[0].progress = Math.min(state.challenges[0].total, state.challenges[0].progress + 1);
  slip.selection = null;
  showToast('Prediction Locked!', `${slip.stake} VP placed on ${m.teamA.short} vs ${m.teamB.short}`, 'success');
  navigate('my-predictions');
}

        <div class="text-3xl">🎁</div>
      </div>

            D${d}
          </div>
        `).join('')}
      </div>
      <button onclick="claimDailyReward()" ${state.user.dailyClaimed ? 'disabled' : ''}
        class="w-full py-3 rounded-xl font-display font-extrabold text-xs ${state.user.dailyClaimed ? 'bg-white/10 text-slate-400' : 'btn-neon'}">
        ${state.user.dailyClaimed ? '✓ Claimed Today (+250 VP)' : 'Claim +250 Virtual Points'}

    <!-- Weekly Challenges -->
    <div class="glass-card rounded-3xl p-4 space-y-3">
      <h3 class="font-display font-bold text-sm">Weekly Challenges</h3>
      ${state.challenges.map(c => {
        const pct = Math.round((c.progress / c.total) * 100);
        const ready = c.progress >= c.total && !c.claimed;
        return `
        <div class="p-3 rounded-2xl bg-white/5 space-y-2">
          <div class="flex justify-between items-center text-xs">
            <span class="font-bold">${c.title}</span>

          <div class="h-2 rounded-full bg-white/10 overflow-hidden">
            <div class="h-full bg-gradient-to-r from-electric to-neon rounded-full" style="width:${pct}%"></div>
          </div>
          <div class="flex justify-between items-center text-[10px] text-slate-400">
            <span>Progress: ${c.progress}/${c.total}</span>
            ${ready ? `<button onclick="claimChallenge('${c.id}')" class="px-2.5 py-1 rounded-lg bg-neon text-navy-950 font-extrabold">Claim Reward</button>` : c.claimed ? `<span class="text-neon font-bold">✓ Claimed</span>` : ''}

        </div>`;

    <!-- Interactive Sports Quiz -->

      </div>
      <div class="font-display font-bold text-sm">Which player holds the record for most centuries in ODI Cricket?</div>
      <div class="grid grid-cols-2 gap-2">
        ${['Virat Kohli', 'Sachin Tendulkar', 'Ricky Ponting', 'Rohit Sharma'].map(ans => `
          <button onclick="answerQuiz('${ans}')" ${state.quizAnswered ? 'disabled' : ''}
            class="p-2.5 rounded-xl text-xs font-semibold border transition ${state.quizAnswered && ans==='Virat Kohli' ? 'bg-neon/20 border-neon text-neon' : 'bg-white/5 border-white/10 hover:border-electric'}">
            ${ans}

        `).join('')}

    <div>

      <div class="grid grid-cols-2 gap-2.5">
        ${state.badges.map(b => `
          <div class="glass-card rounded-2xl p-3 flex items-center gap-2.5 ${b.unlocked ? '' : 'opacity-45'}">
            <div class="text-2xl">${b.icon}</div>
            <div>
              <div class="font-bold text-xs">${b.name}</div>
              <div class="text-[10px] text-slate-400 leading-tight">${b.desc}</div>

}

function claimDailyReward() {
  if (state.user.dailyClaimed) return;
  state.user.dailyClaimed = true;
  state.user.virtualPoints += 250;
  showToast('+250 Virtual Points Claimed!', 'Come back tomorrow for Day 6!', 'success');
  renderApp();
}

function claimChallenge(id) {
  const c = state.challenges.find(x => x.id === id);
  if (!c || c.claimed) return;
  c.claimed = true;
  state.user.virtualPoints += c.reward;
  showToast(`Challenge Complete! +${c.reward} VP`, c.title, 'success');
  renderApp();
}

function answerQuiz(ans) {
  if (state.quizAnswered) return;
  state.quizAnswered = true;
  if (ans === 'Virat Kohli') {
    state.quizCorrect = true;
    state.user.virtualPoints += 250;
    showToast('Correct Answer! +250 VP', 'Virat Kohli leads with 50+ ODI tons!', 'success');
  } else {
    showToast('Nice Try!', 'The correct answer is Virat Kohli.', 'warn');
  }
  renderApp();
}

      <button onclick="state.notifications.forEach(n=>n.unread=false); showToast('All caught up!','','info'); renderApp();" class="text-xs text-electric font-bold">Mark all read</button>

    ${state.notifications.map(n => `
      <div onclick="nMarkRead('${n.id}', '${n.matchId || ''}')" class="glass-card rounded-2xl p-4 flex gap-3 cursor-pointer ${n.unread ? 'border-electric/50 bg-electric/10' : ''}">

          ${n.type==='live' ? '🔴' : n.type==='goal' ? '⚽' : n.type==='win' ? '💰' : n.type==='challenge' ? '⚡' : '🏆'}

}

function nMarkRead(id, matchId) {
  const n = state.notifications.find(x => x.id === id);
  if (n) n.unread = false;
  if (matchId) navigate('match-details', { matchId });
  else renderApp();
}

// ============================================================================
// 5. MODALS & THEME CONTROLS
// ============================================================================
function toggleTheme() {
  state.darkMode = !state.darkMode;
  document.documentElement.classList.toggle('light-theme', !state.darkMode);
  renderApp();
}

function openEditProfileModal() {
  openModal(`
    <div class="space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-display font-bold text-base">Edit Profile</h3>
        <button onclick="closeModal()" class="text-slate-400 text-lg">✕</button>
      </div>
      <div>
        <label class="text-xs text-slate-400 block mb-1">Display Name</label>
        <input id="edit-name" value="${state.user.name}" class="w-full bg-navy-900 border border-white/15 rounded-xl px-3 py-2.5 text-sm text-white outline-none"/>
      </div>
      <div>
        <label class="text-xs text-slate-400 block mb-1">Username</label>
        <input id="edit-user" value="${state.user.username}" class="w-full bg-navy-900 border border-white/15 rounded-xl px-3 py-2.5 text-sm text-white outline-none"/>
      </div>
      <button onclick="saveProfileModal()" class="w-full py-3 rounded-xl btn-3d text-sm font-bold text-white keep-white">Save Changes</button>
    </div>
  `);
}

function saveProfileModal() {
  state.user.name = document.getElementById('edit-name').value || state.user.name;
  state.user.username = document.getElementById('edit-user').value || state.user.username;
  closeModal();
  showToast('Profile Updated!', state.user.name, 'success');
  renderApp();
}

function openLegalModal(title) {
  openModal(`
    <div class="space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-display font-bold text-base text-cyanGlow">${title}</h3>
        <button onclick="closeModal()" class="text-slate-400 text-lg">✕</button>
      </div>
      <p class="text-xs text-slate-300 leading-relaxed">
        <strong>BETZONE X</strong> is a next-generation sports entertainment and social prediction platform.
        All match predictions operate strictly using <strong>free Virtual Points (VP)</strong>.
        There is no real-money wagering, no deposits, no withdrawals, and no cash prizes. Virtual points hold zero monetary value.
      </p>
      <p class="text-xs text-slate-400 leading-relaxed">
        Need help? Contact our 24/7 digital concierge at <span class="text-electric">support@betzonex.app</span>.
      </p>
      <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-white/10 text-xs font-bold">Close</button>

  `);
}

// ============================================================================
// 6. REAL-TIME SCORE TICKER & APP RENDERER
// ============================================================================
function renderApp() {
  const viewport = document.getElementById('screen-viewport');
  const routes = {
    'splash': renderSplash,
    'onboarding': renderOnboarding,
    'login': renderLogin,
    'home': renderHome,
    'sports': renderSports,
    'match-details': renderMatchDetails,
    'live-centre': renderLiveCentre,
    'predictions': renderPredictions,
    'my-predictions': renderMyPredictions,
    'leaderboard': renderLeaderboard,
    'rewards': renderRewards,
    'notifications': renderNotifications,
    'profile': renderProfile,
    'settings': renderSettings,
  };

  const renderer = routes[state.currentScreen] || renderHome;
  viewport.innerHTML = renderer();
  renderBottomNav();
}

// Subtle live match clock simulator every 8 seconds
setInterval(() => {
  const football = state.matches.find(m => m.id === 'm2');
  if (football) {
    let min = parseInt(football.timer) || 74;
    football.timer = (min < 90 ? min + 1 : 90) + "'";
  }
  if (['home', 'match-details', 'live-centre'].includes(state.currentScreen)) {
    // Only refresh subtly when on live score screens without interrupting typing
    if (document.activeElement.tagName !== 'INPUT') {
      renderApp();
    }
  }
}, 9000);

// Boot App
renderApp();
</script>
