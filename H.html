function showToast(title, subtitle = '', type = 'info') {
  const container = document.getElementById('toast-container');
  const styles = {
    success: 'border-neon/50 bg-emerald-950/95 text-neon',
    info: 'border-electric/50 bg-navy-900/95 text-cyanGlow',
    warn: 'border-gold/50 bg-amber-950/95 text-gold'
  };
  const el = document.createElement('div');
  el.className = `glass-card ${styles[type] || styles.info} rounded-2xl px-4 py-3 shadow-2xl border flex items-center justify-between gap-3 anim-enter pointer-events-auto`;
  el.innerHTML = `
    <div class="min-w-0">
      <div class="text-xs font-extrabold tracking-wide truncate">${title}</div>
      ${subtitle ? `<div class="text-[11px] text-slate-300 mt-0.5 truncate">${subtitle}</div>` : ''}
    </div>
    <span class="text-xs font-bold shrink-0">✓</span>
  `;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.25s ease';
    setTimeout(() => el.remove(), 250);
  }, 2400);
}

function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});

function navigate(screen, params = {}, pushHistory = true) {
  if (pushHistory && state.currentScreen !== screen && state.currentScreen !== 'splash') {
    state.history.push({ screen: state.currentScreen, params: state.screenParams });
  }
  state.currentScreen = screen;
  state.screenParams = params;
  renderApp();
}

function goBack() {
  if (state.history.length > 0) {
    const prev = state.history.pop();
    state.currentScreen = prev.screen;
    state.screenParams = prev.params;
    renderApp();
  } else {
    navigate('home', {}, false);
  }
}

function simulateLiveEvent(id) {
  const m = state.matches.find(x => x.id === id);
  if (!m) return;
  if (m.sport === 'Cricket') {
    m.commentary.unshift({ time: '18.3', tag: 'FOUR!', color: 'text-gold', text: 'LIVE PLAY: Cracking square cut to the boundary!' });
    m.teamA.score = '196/4';
    m.timer = '18.3 Ov';
  } else {
    m.commentary.unshift({ time: "79'", tag: 'SHOT!', color: 'text-electric', text: 'LIVE PLAY: Screamer from outside the box just inches wide!' });
    m.timer = "79'";
  }
  showToast('Live Feed Updated', `${m.teamA.short} vs ${m.teamB.short}`, 'info');
  renderApp();
}

function openPredictionForMatch(matchId) {
  state.predictionSlip.matchId = matchId;
  state.predictionSlip.selection = null;
  navigate('predictions');
}

function submitPrediction(matchId) {
  const slip = state.predictionSlip;
  if (!slip.selection) { showToast('Choose an option', 'Tap a team or outcome above', 'warn'); return; }
  if (state.user.virtualPoints < slip.stake) { showToast('Not enough VP', 'Claim daily bonus in Rewards!', 'warn'); return; }

  const m = state.matches.find(x => x.id === matchId);
  state.user.virtualPoints -= slip.stake;
  state.myPredictions.unshift({
    id: 'p' + Date.now(),
    match: `${m.teamA.name} vs ${m.teamB.name}`,
    sport: m.sport,
    market: slip.market,
    pick: slip.selection,
    stake: slip.stake,
    potential: Math.round(slip.stake * slip.multiplier),
    status: 'Active',
    date: 'Just Now'
  });
  state.challenges[0].progress = Math.min(state.challenges[0].total, state.challenges[0].progress + 1);
  slip.selection = null;
  showToast('Prediction Confirmed!', `${slip.stake} VP placed on 777bet`, 'success');
  navigate('my-predictions');
}

// SCREEN 9: MY PREDICTIONS
function renderMyPredictions() {
  const tabs = ['Active', 'Completed', 'Correct', 'Incorrect'];
  const list = state.myPredictions.filter(p => {
    if (state.myPredTab === 'Active') return p.status === 'Active';
    if (state.myPredTab === 'Completed') return p.status !== 'Active';
    return p.status === state.myPredTab;
  });

  const finished = state.myPredictions.filter(p => p.status !== 'Active');
  const wins = finished.filter(p => p.status === 'Correct').length;
  const acc = finished.length ? Math.round((wins / finished.length) * 100) : 80;

  return `
  ${getHeader('My Predictions', true)}
  <div class="screen-scroll px-4 pt-3 space-y-4 anim-enter">

        <div class="font-display font-black text-3xl text-neon mt-0.5">${acc}%</div>
        <div class="text-[11px] text-slate-400 mt-1">${wins} Won • ${finished.length - wins} Missed • ${state.myPredictions.filter(p=>p.status==='Active').length} Active</div>

      <div class="relative w-16 h-16 flex items-center justify-center">

          <circle cx="30" cy="30" r="25" stroke="#00FF87" stroke-width="5" fill="none" stroke-linecap="round"
            stroke-dasharray="157" stroke-dashoffset="${dashOffset}"/>
        </svg>
        <span class="absolute text-xs font-mono font-black text-white">${acc}%</span>
      </div>
    </div>

    <div class="grid grid-cols-4 gap-1.5 p-1 glass-card rounded-2xl">
      ${tabs.map(t => `
        <button onclick="state.myPredTab='${t}'; renderApp();"

      ${list.length ? list.map(p => {
        const badge = p.status==='Correct' ? 'bg-neon/20 text-neon border-neon/40' :
                      p.status==='Incorrect' ? 'bg-rose-500/20 text-rose-400 border-rose-500/40' :
                      'bg-electric/20 text-electric border-electric/40';
        return `
        <div class="glass-card rounded-3xl p-4 space-y-2.5">
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-bold text-slate-400">${p.sport} • ${p.date}</span>
            <span class="px-2.5 py-0.5 rounded-full border text-[10px] font-extrabold ${badge}">${p.status}</span>
          </div>
          <div class="font-display font-bold text-sm">${p.match}</div>
          <div class="flex justify-between items-center text-xs bg-white/5 rounded-2xl p-3">

function claimDaily() {
  if (state.user.dailyClaimed) return;
  state.user.dailyClaimed = true;
  state.user.virtualPoints += 250;
  showToast('+250 VP Claimed!', '777bet Daily Streak Bonus', 'success');
  renderApp();
}
function claimChal(id) {
  const c = state.challenges.find(x => x.id === id);
  if (!c || c.claimed) return;
  c.claimed = true;
  state.user.virtualPoints += c.reward;
  showToast(`+${c.reward} VP Unlocked!`, c.title, 'success');
  renderApp();
}
function answerQuiz(ans) {
  if (state.quizAnswered) return;
  state.quizAnswered = true;
  if (ans === 'Virat Kohli') {
    state.user.virtualPoints += 250;
    showToast('Correct! +250 VP', 'Virat Kohli leads with 50+ ODI tons!', 'success');
  } else {
    showToast('Nice Try!', 'Correct answer: Virat Kohli', 'warn');
  }
  renderApp();
}

      <button onclick="closeModal()" class="w-full py-3 rounded-xl bg-white/10 text-xs font-bold">Close</button>

  `);

function renderApp() {
  const viewport = document.getElementById('screen-viewport');
  const routes = {
    'splash': renderSplash,
    'onboarding': renderOnboarding,
    'login': renderLogin,
    'home': renderHome,
    'sports': renderSports,
    'match-details': renderMatchDetails,
    'live-centre': renderLiveCentre,
    'predictions': renderPredictions,
    'my-predictions': renderMyPredictions,
    'leaderboard': renderLeaderboard,
    'rewards': renderRewards,
    'notifications': renderNotifications,
    'profile': renderProfile,
    'settings': renderSettings
  };
  viewport.innerHTML = (routes[state.currentScreen] || renderHome)();
  renderBottomNav();
}

// Subtle real-time match clock update
setInterval(() => {
  const f = state.matches.find(m => m.id === 'm2');
  if (f) {
    let min = parseInt(f.timer) || 76;
    f.timer = (min < 90 ? min + 1 : 90) + "'";
  }
  if (['home', 'match-details', 'live-centre'].includes(state.currentScreen) && document.activeElement.tagName !== 'INPUT') {
    renderApp();
  }
}, 9000);

renderApp();
</script>
